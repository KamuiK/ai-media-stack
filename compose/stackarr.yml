services:
  stackarr:
    image: ${STACKARR_IMAGE:?Set STACKARR_IMAGE to a pinned tag or digest}
    container_name: stackarr
    restart: unless-stopped

    # Required for your NAS socket ownership: UID 0 / GID 0.
    # Grants Docker API access, NOT read-only monitoring.
    group_add:
      - "0"

    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: "0.0.0.0"
      PORT: "7777"
      TZ: Europe/Vienna

      STACKARR_WEB_PORT: "7777"
      STACKARR_REPO_ROOT: /app
      STACKARR_RUNTIME: docker
      STACKARR_CONTAINER_NAME: stackarr

      STACKARR_DATABASE_FILE: /stackarr-config/stackarr.db
      STACKARR_DATABASE_DIR: /stackarr-config
      STACKARR_DATABASE_MODE: app-default

      # No agent connection or background automation during WP2.
      STACKARR_MCP_HTTP_ENABLED: "false"
      STACKARR_SCHEDULER_ENABLED: "false"

      DOCKER_HOST: unix:///var/run/docker.sock

    ports:
      - "192.168.178.101:7777:7777"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

      # Must point to the directory containing your existing database.
      - ${STACKARR_CONFIG_DIR:?Set existing Stackarr database directory}:/stackarr-config

      - stackarr-state:/stackarr-state

      # Retain your documented backup destination.
      - /volume1/data/backup/stackarr:/backups

      # Optional filesystem visibility; read-only during WP2.
      - /volume1/data/media:/media:ro
      - /volume1/data/torrents:/downloads:ro

volumes:
  stackarr-state: