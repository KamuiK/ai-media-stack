services:
  mcp-arr-anime:
    image: ghcr.io/aplaceforallmystuff/mcp-arr:latest
    container_name: mcp-arr-anime
    restart: unless-stopped
    networks:
      - synobridge
    environment:
      MCP_TRANSPORT: http
      HOST: 0.0.0.0
      PORT: 3000
      SONARR_URL: ${SONARR_ANIME_URL}
      SONARR_API_KEY: ${SONARR_ANIME_API_KEY}
      RADARR_URL: ${RADARR_ANIME_URL}
      RADARR_API_KEY: ${RADARR_ANIME_API_KEY}

networks:
  synobridge:
    external: true