services:
  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v0.22.5}
    container_name: ${HERMES_CONTAINER_NAME:-hermes}
    restart: unless-stopped
    command: gateway run
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    volumes:
      - ${HERMES_DATA_DIR:-/volume1/docker/hermes}:/opt/data
    networks:
      - synobridge
    ports:
      - "${HERMES_GATEWAY_PORT:-8642}:8642"
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.5"

networks:
  synobridge:
    external: true