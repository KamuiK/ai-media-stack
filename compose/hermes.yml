services:
  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:v0.22.5}
    container_name: ${HERMES_CONTAINER_NAME:-hermes}
    restart: unless-stopped
    command: gateway run

    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}

      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_USER}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_PASSWORD}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_SECRET}

    volumes:
      - ${HERMES_DATA_DIR:-/volume1/docker/hermes}:/opt/data

    networks:
      - synobridge

    ports:
      - "${HERMES_GATEWAY_PORT:-8642}:8642"
      - "127.0.0.1:9119:9119"

    deploy:
      resources:
        limits:
          memory: 2g

networks:
  synobridge:
    external: true